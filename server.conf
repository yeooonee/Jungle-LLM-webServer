# 서버 설정. 형식: 키 값 (한 줄에 하나, '#'은 주석)
# CLI 인자가 있으면 이 값을 덮어씀: ./build/server -c server.conf -p 9090 -r ./other
# 상대 경로는 서버를 실행한 폴더 기준
port        8080
root        ./www
mime_types  ./mime.types

# 동적 처리 (CGI): /cgi-bin/이름 → cgi_root/이름 실행 (cgi-src/*.c를 make가 여기로 빌드)
cgi_root        ./build/cgi-bin
cgi_timeout     5          # 초. 넘으면 kill → 504
cgi_max_output  1048576    # 바이트(1MB). 넘으면 502
cgi_log         ./cgi.log  # CGI 프로그램의 stderr

# 동시 처리 (스레드 풀)
workers          8     # 워커 스레드 수
queue_size       16    # 작업 큐 칸 수. 꽉 차면 accept 멈춤 (손님은 OS listen 대기열에서 대기)
read_timeout     5     # 초. read 한 번이 기다리는 최대 시간
request_timeout  10    # 초. 요청 전체(헤더+본문)를 다 받는 기한. 넘으면 408 (0바이트면 조용히 close)

# Reverse Proxy: route 줄이 하나라도 있으면 서버 전체가 프록시 (정적·CGI 꺼짐)
# 형식: route 접두사 호스트:포트 [호스트:포트 ...]  → 가장 긴 접두사, 접두사 떼고 전달, 라운드 로빈
# route /api  127.0.0.1:9001 127.0.0.1:9002
backend_connect_timeout  2         # 초. 넘으면 다음 백엔드 (모두 실패면 504)
backend_read_timeout     5         # 초. read 한 번. 넘으면 GET·HEAD·PUT·DELETE만 다음 백엔드, 나머지 504
backend_max_response     1048576   # 바이트(1MB). 응답을 다 받아 보내므로 상한. 넘으면 502
